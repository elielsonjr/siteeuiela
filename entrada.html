<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>❤️ Um Presente Para Você</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: 'Arial', sans-serif;
            color: white;
            text-align: center;
        }
        .surpresa-box {
            padding: 30px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.8);
            max-width: 500px;
        }
        h1 {
            color: #e50914;
            margin-bottom: 20px;
            font-family: 'Playfair Display', serif;
        }
        #surpresa-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s;
            position: relative;
            overflow: hidden;
        }
        #surpresa-btn:hover {
            transform: scale(1.1);
        }
        #surpresa-btn::after {
            content: "❤️";
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: all 0.5s;
        }
        #surpresa-btn:hover::after {
            opacity: 1;
            top: -40px;
        }
        #countdown {
            display: none;
            font-size: 24px;
            margin-top: 20px;
            color: #ff69b4;
        }
    </style>
</head>
<body>
    <div class="surpresa-box">
        <h1>❤️ Para Você, Meu Amor ❤️</h1>
        <p>Preparei algo especial para relembrarmos nossa história...</p>
        <button id="surpresa-btn">Clique para a Surpresa!</button>
        <div id="countdown"></div>
    </div>

    <!-- Música de Fundo (Opcional) -->
    <audio id="bgMusic" loop>
        <source src="assets/audio/nossa-musica.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.getElementById("surpresa-btn").addEventListener("click", function() {
            this.style.display = "none";
            const countdownEl = document.getElementById("countdown");
            countdownEl.style.display = "block";
            
            // Toca música (opcional)
            document.getElementById("bgMusic").play();
            
            // Countdown
            let count = 3;
            countdownEl.innerHTML = `A surpresa começa em ${count}... ❤️`;
            
            const timer = setInterval(() => {
                count--;
                countdownEl.innerHTML = `A surpresa começa em ${count}... ❤️`;
                
                if (count <= 0) {
                    clearInterval(timer);
                    window.location.href = "index.html";
                }
            }, 1000);
        });
    </script>
</body>
</html>
