<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eu e ela - Início</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <script src="https://unpkg.com/masonry-layout@4/dist/masonry.pkgd.min.js"></script>
</head>
<body>
    <!-- Header fixo -->
    <header class="header">
        <div class="logo">Eu e ela</div>
        <nav class="nav">
            <a href="index.html" class="active">Início</a>
            <a href="videos.html">Vídeos</a>
        </nav>
        <div class="profile-icon">
            <img src="assets/images/nosso-perfil.jpg" alt="Nossa Foto">
        </div>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>Nosso Amor em Cada Cena ❤️</h1>
        <div id="tempo-namoro"></div>
    </section>

    <!-- Categorias -->
    <main class="main-content">
        <section class="category">
            <h2>📸 Momentos Especiais</h2>
            <div class="gallery" id="momentos-especiais"></div>
        </section>


        <section class="category">
            <h2>🎥 Nossos Vídeos</h2>
            <div class="gallery" id="videos"></div>
        </section>
    </main>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">×</span>
            <img id="modal-image" src="" alt="Imagem Especial" style="display: none;">
            <video id="modal-video" style="display: none;">
                <source src="" type="video/mp4">
                Seu navegador não suporta vídeos HTML5.
            </video>
            <h3 id="modal-title"></h3>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
